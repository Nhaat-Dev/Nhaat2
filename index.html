<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link - Ducknovit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; background-color: #f3f4f6; }
        .pixel-border { border: 4px solid #1a1a1a; box-shadow: 4px 4px 0px #00000020; transition: all 0.2s; }
        .pixel-border-sm { border: 2px solid #1a1a1a; }
        .btn-pixel:hover { background-color: #1a1a1a; color: white; transform: translate(-2px, -2px); box-shadow: 4px 4px 0px #000; }
        .progress-fill { background-color: #1a1a1a; height: 100%; }
        /* Hiệu ứng lá rơi nhẹ cho sinh động */
        @keyframes leafFall { 0% { top: -10%; transform: translateX(0) rotate(0); } 100% { top: 110%; transform: translateX(100px) rotate(360deg); } }
        .leaf { position: fixed; color: #555; pointer-events: none; z-index: -1; animation: leafFall 10s linear infinite; }
    </style>
</head>

                </div>
